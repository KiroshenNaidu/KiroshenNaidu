<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900" height="50" viewBox="0 0 900 50" role="img" aria-label="Divider">
  <!-- SECTION DIVIDER - a stone line with a gently rocking leaf in the middle -->
  <defs>
    <symbol id="leaf" viewBox="-12 -14 24 28" overflow="visible">
      <path d="M0,-13 C7,-8 8,4 0,13 C-8,4 -7,-8 0,-13 Z"/>
      <path d="M0,-11 L0,12" stroke="#0F2418" stroke-opacity="0.35" stroke-width="0.9" fill="none"/>
      <path d="M0,-3 L4,-6 M0,2 L-4,-1 M0,6 L4,3" stroke="#0F2418" stroke-opacity="0.25" stroke-width="0.7" fill="none"/>
    </symbol>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A8D8F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8A8D8F" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8A8D8F" stop-opacity="0"/>
    </linearGradient>
    <style>
      .rock { animation: rock 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      @keyframes rock { 0%, 100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }
      .rock2 { animation-duration: 5s; animation-delay: -1.5s; }

      /* Respect visitors who turn off animations in their device settings */
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>
  <rect x="60" y="24" width="780" height="2" fill="url(#line)"/>
  <circle cx="390" cy="25" r="3" fill="#8A8D8F"/>
  <circle cx="510" cy="25" r="3" fill="#8A8D8F"/>
  <g class="rock"><use href="#leaf" xlink:href="#leaf" x="440" y="4" width="18" height="22" fill="#8FB996" transform="rotate(-25 449 26)"/></g>
  <g class="rock rock2"><use href="#leaf" xlink:href="#leaf" x="444" y="6" width="16" height="20" fill="#4A7C59" transform="rotate(30 452 26)"/></g>
</svg>
