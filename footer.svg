<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900" height="160" viewBox="0 0 900 160" role="img" aria-label="Footer">
  <!-- FOOTER - leaves falling onto swaying grass and stones -->
  <defs>
    <symbol id="leaf" viewBox="-12 -14 24 28" overflow="visible">
      <path d="M0,-13 C7,-8 8,4 0,13 C-8,4 -7,-8 0,-13 Z"/>
      <path d="M0,-11 L0,12" stroke="#0F2418" stroke-opacity="0.35" stroke-width="0.9" fill="none"/>
      <path d="M0,-3 L4,-6 M0,2 L-4,-1 M0,6 L4,3" stroke="#0F2418" stroke-opacity="0.25" stroke-width="0.7" fill="none"/>
    </symbol>
    <linearGradient id="fsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F3D2B"/>
      <stop offset="1" stop-color="#0F2418"/>
    </linearGradient>
    <style>
      .blade { animation-name: bend; animation-timing-function: ease-in-out; animation-iteration-count: infinite;
                transform-box: fill-box; transform-origin: 50% 100%; }
      @keyframes bend { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
      .quote { font-family: Georgia, 'Palatino Linotype', 'Times New Roman', serif; fill: #8FB996;
                font-size: 13px; letter-spacing: 4px; }

      .fall { animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
      .sway { animation-name: sway; animation-timing-function: ease-in-out; animation-iteration-count: infinite;
               transform-box: fill-box; transform-origin: center; }
      @keyframes fall {
        0%   { transform: translateY(-30px); opacity: 0; }
        8%   { opacity: 1; }
        88%  { opacity: 1; }
        100% { transform: translateY(120px); opacity: 0; }
      }
      @keyframes sway {
        0%, 100% { transform: translateX(-16px) rotate(-30deg); }
        50%      { transform: translateX(16px) rotate(40deg); }
      }

      /* Respect visitors who turn off animations in their device settings */
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>
  <clipPath id="fframe"><rect width="900" height="160" rx="14"/></clipPath>
